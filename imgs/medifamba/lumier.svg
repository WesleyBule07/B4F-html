<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Ícone Primário -->
    <linearGradient id="lumier-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0145F2" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Sombreamento Suave -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0145F2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fundo Canvas Cloud -->
  <rect width="100%" height="100%" fill="#EDF1F5" rx="16" />

  <g transform="translate(100, 70)">
    <!-- Ícone: Monograma L + Feixe de Luz / Obturador Criativo -->
    <g filter="url(#soft-shadow)">
      <!-- Haste Vertical do L -->
      <path d="M 40 40 L 90 40 L 90 190 L 40 190 Z" fill="url(#lumier-grad)" />
      
      <!-- Haste Horizontal do L -->
      <path d="M 40 140 L 210 140 L 210 190 L 40 190 Z" fill="url(#lumier-grad)" />

      <!-- Feixe de Luz / Lente (Acento Criativo) -->
      <path d="M 90 40 L 230 40 L 190 80 L 90 80 Z" fill="#00D2FF" opacity="0.85" />
      <path d="M 90 80 L 190 80 L 140 140 L 90 140 Z" fill="#0145F2" opacity="0.9" />
      
      <!-- Ponto de Luz no Centro -->
      <circle cx="115" cy="115" r="12" fill="#FFFFFF" />
    </g>

    <!-- Tipografia: LUMIER -->
    <text x="150" y="270" 
          text-anchor="middle" 
          font-family="'Poppins', 'Helvetica Neue', sans-serif" 
          font-weight="800" 
          font-size="42" 
          letter-spacing="4" 
          fill="#121826">
      LUMIER
    </text>

    <!-- Tipografia: STUDIO -->
    <text x="150" y="305" 
          text-anchor="middle" 
          font-family="'Poppins', 'Helvetica Neue', sans-serif" 
          font-weight="500" 
          font-size="16" 
          letter-spacing="12" 
          fill="#0145F2">
      STUDIO
    </text>
  </g>
</svg>
